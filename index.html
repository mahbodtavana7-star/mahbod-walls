<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دیوارهای مهبد</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1018;color:white;font-family:Tahoma,Arial;line-height:2}
header{text-align:center;padding:25px;color:#b8ff45;font-size:27px;font-weight:bold}
main{max-width:950px;margin:auto;padding:20px}
.hero{text-align:center;padding:45px 10px;background:linear-gradient(135deg,#202d42,#10131b);border-radius:22px}
h1{font-size:35px;color:#b8ff45}
p{color:#c1c6d0}
h2{text-align:center;margin-top:45px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#1b2230;border:1px solid #30394a;border-radius:18px;overflow:hidden;text-align:center;padding-bottom:18px}
.art{height:180px;display:grid;place-items:center;font-size:45px}
.a{background:linear-gradient(135deg,#14213d,#4679b9)}
.b{background:linear-gradient(135deg,#ffad65,#b83e65)}
.c{background:linear-gradient(135deg,#063d35,#9acb73)}
.d{background:linear-gradient(135deg,#32145d,#bd81d9)}
.e{background:linear-gradient(135deg,#333,#aaa)}
.f{background:linear-gradient(135deg,#344b12,#b8e65b)}
button{background:#b8ff45;color:#17200b;border:0;border-radius:10px;padding:10px 20px;font-size:15px;font-weight:bold}
footer{text-align:center;color:#aaa;padding:35px}
</style>
</head>
<body>
<header>MAHBOD WALLS</header>
<main>
<section class="hero">
<h1>دیوارهای مهبد</h1>
<p>دنیایی از تصاویر خاص برای پس‌زمینه گوشی تو</p>
<a href="#products"><button>دیدن تصاویر</button></a>
</section>
<h2 id="products">تصاویر منتخب</h2>
<section class="grid">
<div class="card"><div class="art a">🌌</div><h3>آبی نیمه‌شب</h3><p>۵۰٬۰۰۰ تومان</p><button onclick="alert('این فروشگاه هنوز آزمایشی است')">مشاهده</button></div>
<div class="card"><div class="art b">🌇</div><h3>غروب نارنجی</h3><p>۵۰٬۰۰۰ تومان</p><button onclick="alert('این فروشگاه هنوز آزمایشی است')">مشاهده</button></div>
<div class="card"><div class="art c">🌿</div><h3>جنگل سبز</h3><p>۵۰٬۰۰۰ تومان</p><button onclick="alert('این فروشگاه هنوز آزمایشی است')">مشاهده</button></div>
<div class="card"><div class="art d">💜</div><h3>کهکشان بنفش</h3><p>۵۰٬۰۰۰ تومان</p><button onclick="alert('این فروشگاه هنوز آزمایشی است')">مشاهده</button></div>
<div class="card"><div class="art e">◈</div><h3>خاکستری مینیمال</h3><p>۵۰٬۰۰۰ تومان</p><button onclick="alert('این فروشگاه هنوز آزمایشی است')">مشاهده</button></div>
<div class="card"><div class="art f">🍃</div><h3>طبیعت لیمویی</h3><p>۵۰٬۰۰۰ تومان</p><button onclick="alert('این فروشگاه هنوز آزمایشی است')">مشاهده</button></div>
</section>
</main>
<footer>© دیوارهای مهبد | MAHBOD WALLS</footer>
</body>
</html>
